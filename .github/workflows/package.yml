name: Package BioMed-QAgent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: TypeScript check
        run: pnpm tsc

      - name: Upload frontend distribution
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 1

  package:
    name: Package Windows Executable
    needs: build-frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./backend/dist

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install PyInstaller
        run: uv pip install --system pyinstaller

      - name: Package with PyInstaller
        run: pyinstaller --onefile --name "BioMed-QAgent" --add-data "dist;dist" --hidden-import app --hidden-import app.api --hidden-import app.agent_loop --hidden-import app.domain --hidden-import app.skills --hidden-import app.tools --collect-all app launcher.py

      - name: List build output
        run: Get-ChildItem -Path dist -Name

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BioMed-QAgent-${{ github.ref_name }}-windows
          path: ./backend/dist/BioMed-QAgent.exe

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: BioMed-QAgent-${{ github.ref_name }}-windows

      - name: List workspace files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BioMed-QAgent ${{ github.ref_name }}
          generate_release_notes: true
          files: BioMed-QAgent.exe
          fail_on_unmatched_files: false
