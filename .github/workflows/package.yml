name: Package BioMed-QAgent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: TypeScript check
        run: pnpm tsc

      - name: Upload frontend distribution
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 1

  build-server:
    name: Build TS Application Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        working-directory: ./server
        run: pnpm build

      - name: Upload server distribution
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./server/dist
          retention-days: 1

  package:
    name: Package Cross-Platform Bundle
    needs: [build-frontend, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute bundle artifact name
        run: |
          safe="${GITHUB_REF_NAME//\//-}"
          echo "BUNDLE_NAME=BioMed-QAgent-${safe}-bundle" >> "$GITHUB_ENV"

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./staging/frontend/dist

      - name: Download server build
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./staging/server/dist

      - name: Stage bundle contents
        run: |
          mkdir -p staging
          cp -r .pi staging/.pi
          cp -r database staging/database
          cp package.json pnpm-workspace.yaml pnpm-lock.yaml pyproject.toml uv.lock staging/
          cp tsconfig.base.json staging/
          cp -r packages staging/packages
          rm -rf staging/packages/contracts/node_modules
          cp -r server/src staging/server/src
          cp server/package.json staging/server/
          cp server/tsconfig.json staging/server/
          # frontend/dist 与 server/dist 已由上方 download-artifact 放入 staging/
          cp -r frontend staging/frontend
          rm -rf staging/frontend/node_modules
          cp .env.example staging/

      - name: Create archive
        run: |
          cd staging
          zip -qr ../BioMed-QAgent-bundle.zip .

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: ./BioMed-QAgent-bundle.zip

  release-smoke:
    name: Release bundle smoke (unpack → install → start → health)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Compute bundle artifact name
        run: |
          safe="${GITHUB_REF_NAME//\//-}"
          echo "BUNDLE_NAME=BioMed-QAgent-${safe}-bundle" >> "$GITHUB_ENV"
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Unpack bundle
        run: |
          mkdir bundle
          unzip -q BioMed-QAgent-bundle.zip -d bundle
          ls bundle

      - name: Install workspace deps
        working-directory: ./bundle
        run: pnpm install --frozen-lockfile

      - name: Sync database project
        working-directory: ./bundle
        run: uv sync --frozen

      - name: Bridge self-test (bundled database/)
        working-directory: ./bundle
        run: uv run python database/bridge.py --self-test

      - name: Start production host and probe health
        working-directory: ./bundle
        run: |
          pnpm start > start.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 60); do
            sleep 2
            if curl -sf http://127.0.0.1:5173/api/v1/health > health.json 2>/dev/null; then ok=1; break; fi
          done
          if [ -z "$ok" ]; then
            echo "host did not become healthy; start.log:"
            tail -40 start.log
            exit 1
          fi
          cat health.json
          curl -sf -o /dev/null -w "GET / -> %{http_code}\n" http://127.0.0.1:5173/
          curl -sf http://127.0.0.1:5173/api/v1/databases | python -c "import json,sys; d=json.load(sys.stdin); print('GET /api/v1/databases ->', len(d['databases']), 'entries')"
          kill $pid 2>/dev/null || true

  release:
    name: Create Release
    needs: [package, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute bundle artifact name
        run: |
          safe="${GITHUB_REF_NAME//\//-}"
          echo "BUNDLE_NAME=BioMed-QAgent-${safe}-bundle" >> "$GITHUB_ENV"
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BioMed-QAgent ${{ github.ref_name }}
          generate_release_notes: true
          files: BioMed-QAgent-bundle.zip
          fail_on_unmatched_files: false
