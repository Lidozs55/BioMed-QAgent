name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: pnpm workspace gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      # System Python so the TS DatabaseClient tests can spawn the bridge
      # (stdlib-only; probePythonBin falls back to PATH python).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @biomed/server exec playwright install --with-deps chromium
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  database:
    name: Python database bridge gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync database project
        run: uv sync --frozen
      - name: Bridge self-test
        run: uv run python database/bridge.py --self-test
      - name: Test
        run: uv run pytest database/tests
      - name: Lint
        run: uv run ruff check database

  windows:
    name: Windows build-lock + dataset core + bridge gates (I-04)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync database project
        run: uv sync --frozen
      - name: Windows bridge self-test
        run: uv run python database/bridge.py --self-test
      - name: Build @biomed/contracts (workspace wire DTOs)
        # The windows job runs vitest directly on a curated test list; the
        # server package's `pretest` (which builds @biomed/contracts) is not
        # invoked here, so dist/ must be built explicitly in a fresh checkout.
        run: pnpm --filter @biomed/contracts build
      - name: Build-lock + dataset core tests
        working-directory: ./server
        run: npx vitest run tests/phase5/build-lock.test.ts tests/phase5/straggler-safety.test.ts tests/phase5/core-preemption.test.ts tests/phase5/ts-core-e2e.test.ts tests/dataset-adapters.test.ts tests/dataset-canonicalizer.test.ts tests/dataset-integrator.test.ts tests/dataset-publication.test.ts tests/dataset-validation.test.ts
