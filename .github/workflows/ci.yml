name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: pnpm workspace gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync Python runtime
        working-directory: ./backend
        run: uv sync
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @biomed/server exec playwright install --with-deps chromium
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  python:
    name: Python backend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync Python runtime
        working-directory: ./backend
        run: uv sync
      - name: Test
        working-directory: ./backend
        run: uv run pytest
      - name: Lint
        working-directory: ./backend
        run: uv run ruff check app/ tests/ launcher.py

  windows-lock:
    name: Windows build-lock + dataset core gates (I-04)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build-lock + dataset core tests
        working-directory: ./server
        run: npx vitest run tests/phase5/build-lock.test.ts tests/phase5/straggler-safety.test.ts tests/phase5/core-preemption.test.ts tests/phase5/ts-core-e2e.test.ts tests/dataset-adapters.test.ts tests/dataset-canonicalizer.test.ts tests/dataset-integrator.test.ts tests/dataset-publication.test.ts tests/dataset-validation.test.ts
