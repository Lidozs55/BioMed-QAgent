# 单位别名字典
# 用途：将不同数据源使用的单位别名（log2FoldChange / logFC / μM / uM 等）对齐到标准单位
# 加载方：scripts/cleaners/field_aligner.py、unit_normalizer.py（字段单位归一化）
# 维护：BioMed QAgent
# 命名规范：canonical 采用程序化小写标准（如 log2fc、um、nm）；synonyms 含大小写变体、希腊字母变体、Pascal 命名
version: 1.0.0
updated_at: 2026-07-05

# 单位表：每条记录包含 canonical 标准单位、synonyms 别名列表、category 单位类别
units:
  # ===== 表达量对数类 =====
  - canonical: log2
    synonyms: [log2, log_2, log2_transform, base-2 log, log2_transform]
    category: expression_log

  - canonical: log2fc
    synonyms: [log2FoldChange, log2_FC, logFC, log2_fold_change, log fold change, log2FC, log2fc]
    category: expression_log

  - canonical: log_ratio
    synonyms: [log ratio, logRatio, log_ratio, LR]
    category: expression_log

  - canonical: log10
    synonyms: [log10, log_10, base-10 log]
    category: expression_log

  # ===== 倍数变化（fold change）=====
  - canonical: fold_change
    synonyms: [FC, fold change, foldchange, FoldChange, FC_value]
    category: fold_change

  # ===== P 值类 =====
  - canonical: p_value
    synonyms: [p, P, P.Value, pvalue, pval, p-value, PValue, raw_p, p_value, rawp]
    category: p_value

  - canonical: padj
    synonyms: [padj, adj_p, adj_p_value, FDR, q_value, qvalue, BH, P.adj, PAdj, adjusted_p, p.adj]
    category: p_value

  # ===== 浓度类 =====
  - canonical: uM
    synonyms: [μM, µM, uM, umol/L, umolL, micromolar, microM, µmol/L]
    category: concentration

  - canonical: nM
    synonyms: [nM, nmol/L, nanomolar, nanoM, nmolL]
    category: concentration

  - canonical: mM
    synonyms: [mM, mmol/L, millimolar, milliM, mmolL]
    category: concentration

  - canonical: mol_L
    synonyms: [mol/L, M, molL, molar]
    category: concentration

  - canonical: ug_mL
    synonyms: [ug/mL, µg/mL, mcg/mL, ug/mL, microgram/mL]
    category: concentration

  # ===== 计数 / 表达量类 =====
  - canonical: count
    synonyms: [count, reads, raw_count, Counts, n]
    category: count

  - canonical: CPM
    synonyms: [CPM, counts per million, Cpm]
    category: count

  - canonical: TPM
    synonyms: [TPM, transcripts per million, Tpm]
    category: count

  - canonical: RPKM
    synonyms: [RPKM, reads per kilobase per million, Rpkm]
    category: count

  - canonical: FPKM
    synonyms: [FPKM, fragments per kilobase per million, Fpkm]
    category: count

  # ===== 百分比 / 比率 =====
  - canonical: percent
    synonyms: [%, percent, %w/w, percent_value]
    category: fold_change

  - canonical: ratio
    synonyms: [ratio, Ratio, r, ratio_value]
    category: fold_change
