[project]
name = "backend"
version = "0.1.0"
description = "BioMed-QAgent backend — multi-source biomedical data acquisition, processing, and analysis agent loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai-agents>=0.1.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.30.0",
    "matplotlib>=3.9.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "websockets>=12.0",
]

# Optional dependencies — install with `uv sync --extra <name>` or
# `uv pip install -e ".[<name>]"`. These are NOT pulled in by default `uv sync`.
#
# - pdf: PyPDF2 as an alternative backend for extract_tables.py. pdfplumber
#   remains the primary backend; PyPDF2 is a graceful fallback used only when
#   pdfplumber fails to parse a given PDF. See app/skills/builtin/processing/
#   extract_tables.py:_resolve_pdf_backend.
#
# Note: the previously-proposed `ocr` (pytesseract) and `chart` (pdf2image +
# opencv) extras were dropped — §5.2 of TODO.md replaced the traditional CV
# approach with a Qwen-VL vision-model fallback, so those deps are not needed.
[project.optional-dependencies]
pdf = ["PyPDF2>=3.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests that make explicit network requests to official services",
]
asyncio_mode = "strict"
# Treat ALL warnings as errors — any warning aborts the release.
# Only well-understood third-party deprecations are explicitly ignored.
filterwarnings = [
    "error",
    # Starlette TestClient deprecation (FastAPI < 0.116 re-exports it)
    # The warning class changed from DeprecationWarning to StarletteDeprecationWarning
    # in newer Starlette versions, so we match the message text broadly.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ---------------------------------------------------------------------------
# Ruff — Python linter / static analyzer
# ---------------------------------------------------------------------------
# Runs in CI quality gate: `uv run ruff check app/ tests/ launcher.py`
# Any rule violation (warning or error) aborts the release.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Rule families enabled:
#   E  — pycodestyle errors & warnings (PEP 8)
#   F  — pyflakes (unused imports, variables, etc.)
#   W  — pycodestyle warnings
#   I  — isort (import ordering)
#   UP — pyupgrade (modernize syntax)
#   B  — flake8-bugbear (common pitfalls)
#   SIM — flake8-simplify (code simplification)
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test files may use longer lines and assert-only patterns
"tests/**/*.py" = ["E501"]
