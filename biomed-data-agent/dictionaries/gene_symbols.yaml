# 基因符号同义词字典
# 用途：将多源异构基因名（别名、旧符号、拼写变体、小写形式）对齐到 HGNC 官方基因符号
# 加载方：scripts/cleaners/field_aligner.py（用于 gene_symbol 字段值标准化与别名归并）
# 维护：BioMed QAgent
# 数据来源：HGNC (https://www.genenames.org/)、NCBI Gene
# 命名规范：canonical 一律为 HGNC 官方符号（大写）；synonyms 含旧符号、常见拼写变体、小写形式
version: 1.0.0
updated_at: 2026-07-05

