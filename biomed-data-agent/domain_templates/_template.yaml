# 通用领域模板（domain_templates/ 下其他模板的基础结构）
# 用途：当用户研究目标不属于已定义的领域（TCM / 肿瘤学等）时，回退到此通用模板
# 加载方：SKILL.md Step 1（领域识别与模板加载阶段）
# 维护：BioMed QAgent
# 备注：其他领域模板（tcm.yaml / oncology.yaml 等）应继承本模板的所有字段并按需覆盖
template_name: 通用模板
description: |
  通用生物医学研究模板，适用于未匹配特定领域（TCM / 肿瘤学）的研究目标。
  提供基础的字段映射、数据源优先级与分析配方配置，作为其他领域模板的基类。

# 优先数据源：按调用顺序排列，第一个为最高优先级
priority_sources:
  - source: PubMed
    reason: 文献检索基础数据源，覆盖最广
    client: scripts/datasources/pubmed_client.py
  - source: NCBI
    reason: 基因/蛋白序列与注释权威来源
    client: scripts/datasources/ncbi_client.py
  - source: KEGG
    reason: 通路富集分析标准数据源
    client: scripts/datasources/kegg_client.py
  - source: STRING
    reason: 蛋白互作网络数据源
    client: scripts/datasources/string_client.py

# 推荐字段映射：指向 dictionaries/field_aliases.yaml 中的 unified 字段
recommended_field_mappings:
  - gene_symbol
  - compound_name
  - target_protein
  - log2fc
  - p_value
  - adj_p_value
  - pathway_id
  - pubmed_id
  - doi

# 推荐分析配方：scripts/analysis/ 下的脚本
analysis_recipes:
  - name: differential_expression
    script: scripts/analysis/differential_expression.py
    when_to_use: 当数据为基因表达矩阵（含 log2fc + p_value）
    required_fields: [gene_symbol, log2fc, p_value]
  - name: go_kegg_enrichment
    script: scripts/analysis/enrichment.py
    when_to_use: 当存在差异基因列表时进行功能富集
    required_fields: [gene_symbol]
  - name: ppi_network
    script: scripts/analysis/ppi_network.py
    when_to_use: 当需要分析蛋白互作网络中心性
    required_fields: [gene_symbol, target_protein]

# 置信度阈值：低于阈值的数据记录标记 quality_flag needs_review
confidence_thresholds:
  api_result: 0.9          # 直接 API 调用返回的数据
  crawl_result: 0.7        # 爬虫抓取的数据
  literature_extraction: 0.8   # 从文献表格中提取的数据
  pdf_table_extraction: 0.75   # 从 PDF 表格提取的数据
  needs_review_below: 0.6      # 低于此阈值必须人工复核

# 其他注意事项
notes: |
  - 通用模板不预设特定疾病或药物，按用户查询动态决定数据源
  - 当用户研究目标涉及中医药或肿瘤学时，应优先加载对应专用模板
  - 字段映射默认依赖 dictionaries/field_aliases.yaml，可被专用模板覆盖
