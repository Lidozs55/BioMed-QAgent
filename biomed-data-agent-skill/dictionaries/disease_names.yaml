# 维护：BioMed QAgent
# 数据来源：MeSH (https://meshb.nlm.nih.gov/)、ICD-10、DOID (Disease Ontology)
# 命名规范：canonical 采用 MeSH 首选英文名（首字母大写）；synonyms 含中文名、缩写、ICD 编码
version: 1.0.0
updated_at: 2026-07-05

