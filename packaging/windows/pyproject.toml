[project]
name = "biomed-qagent-launcher"
version = "0.2.0"
description = "pywebview GUI launcher for the BioMed-QAgent Windows portable bundle."
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5,<6",
]

[tool.uv]
# Source-tree project: tests and the PyInstaller build run against the
# checkout, nothing is installed as a distribution.
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.10,<7",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["biomed_launcher", "tests"]

[tool.ruff.lint]
# Same rule families as the root project gates (E/F/W/I/UP/B/SIM).
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
