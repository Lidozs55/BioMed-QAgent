openapi: 3.0.3
info:
  title: BioMed QAgent API
  description: |
    面向生物医学研究的 AI 多智能体系统 API。
    输入自然语言研究目标，系统自动完成 数据查找 → 解析 → 清洗 → 分析 → 审查 → 报告 全流程。
    强制使用阿里云百炼 DashScope 平台（qwen-plus/qwen-max/qwen-vl-max）。
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: 本地开发服务器
  - url: http://127.0.0.1:8000
    description: 本地回环

paths:
  # ===== 系统 =====
  /:
    get:
      summary: API 概览
      tags: [root]
      responses:
        '200':
          description: API 端点列表

  /api/v1/health:
    get:
      summary: 健康检查
      tags: [system]
      responses:
        '200':
          description: 服务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  dashscope_configured: { type: boolean }

  /api/v1/tools:
    get:
      summary: 列出所有可用工具
      tags: [system]
      responses:
        '200':
          description: 按 8 类分组的工具列表
          content:
            application/json:
              schema:
                type: object
                description: "{datasources/parsers/cleaners/analysis/io/optimization/viz/export: [tool_name]}"

  # ===== 任务管理 =====
  /api/v1/tasks:
    post:
      summary: 创建任务
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [research_goal]
              properties:
                research_goal:
                  type: string
                  description: 研究目标（自然语言描述）
                  example: 分析健脾散结方对胰腺癌肝转移的影响
                domain_hint:
                  type: string
                  nullable: true
                  description: 领域提示（如 tcm/oncology/pharmacology）
                max_sources:
                  type: integer
                  default: 20
                  description: 每个数据源最大返回数
                enable_analysis:
                  type: boolean
                  default: true
                  description: 是否运行分析阶段
      responses:
        '200':
          description: 任务创建成功
    get:
      summary: 列出所有任务
      tags: [tasks]
      responses:
        '200':
          description: 任务列表（按创建时间倒序）

  /api/v1/tasks/{task_id}:
    get:
      summary: 获取任务详情
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 任务详情 }
        '404': { description: 任务不存在 }
    delete:
      summary: 删除任务
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 已删除 }
        '404': { description: 任务不存在 }

  /api/v1/tasks/{task_id}/start:
    post:
      summary: 启动任务执行
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务已启动（异步执行）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: started }
                  task_id: { type: string }
                  websocket: { type: string, example: /api/v1/ws/tasks/{task_id} }
        '400': { description: 任务状态不允许启动 }
        '404': { description: 任务不存在 }

  /api/v1/tasks/{task_id}/status:
    get:
      summary: 查询任务状态
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 当前状态与各阶段进度
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status: { type: string }
                  is_running: { type: boolean }
                  stages: { type: object }
                  total_records: { type: integer }
                  errors: { type: array, items: { type: string } }

  /api/v1/tasks/{task_id}/upload:
    post:
      summary: 上传 PDF 或图表图片或生物数据文件
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    支持的文件类型：
                    - PDF: .pdf
                    - 图片: .png/.jpg/.jpeg/.webp/.bmp/.gif（Qwen-VL 图表提取）
                    - 生物数据: .soft/.soft.gz/.pdb/.ent/.fasta/.fa/.faa/.fna/.fastq/.tsv/.sif/.graphml/.xml
      responses:
        '200':
          description: 文件已保存到 uploads 目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  filename: { type: string }
                  size: { type: integer }
                  path: { type: string }
        '400': { description: 不支持的文件类型 }
        '404': { description: 任务不存在 }

  /api/v1/tasks/{task_id}/analysis:
    get:
      summary: 获取任务分析结果
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: PPI/富集/药物靶点/差异表达/Hub基因/上游调控分析结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  analysis_types: { type: array, items: { type: string } }
                  analysis: { type: object }
                  has_results: { type: boolean }

  /api/v1/tasks/{task_id}/files:
    get:
      summary: 列出任务输出文件
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 输出目录中的文件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size: { type: integer }
                        modified: { type: number }

  # ===== 数据查询与导出 =====
  /api/v1/tasks/{task_id}/data:
    get:
      summary: 查询任务数据记录（分页）
      tags: [data]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: source
          in: query
          schema: { type: string }
          description: 按数据源过滤
      responses:
        '200':
          description: 分页数据记录 + 数据源分布统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  sources: { type: object }
                  records: { type: array, items: { type: object } }

  /api/v1/tasks/{task_id}/export/{fmt}:
    get:
      summary: 导出数据为 CSV 或 JSON
      tags: [data]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: fmt
          in: path
          required: true
          schema: { type: string, enum: [csv, json] }
      responses:
        '200':
          description: 文件下载
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: string }
        '400': { description: 不支持的格式 }

  /api/v1/tasks/{task_id}/export/merged/csv:
    get:
      summary: 导出多源整合 CSV（按实体类型分组，字段对齐）
      tags: [data]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 整合 CSV 文件下载
          content:
            text/csv:
              schema: { type: string }
        '404': { description: 整合CSV尚未生成 }

  /api/v1/tasks/{task_id}/report:
    get:
      summary: 获取 HTML 研究报告
      tags: [data]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: LLM 综合研究报告 HTML
          content:
            text/html:
              schema: { type: string }
        '404': { description: 报告尚未生成 }

  /api/v1/tasks/{task_id}/regenerate-report:
    post:
      summary: 重新生成 LLM 综合研究报告
      tags: [data]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 报告已重新生成
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status: { type: string, example: ok }
                  report_length: { type: integer }
                  merged_csv_rows: { type: integer }
                  records_count: { type: integer }
        '400': { description: 任务无数据记录 }
        '500': { description: LLM 报告生成失败 }

  # ===== 溯源 =====
  /api/v1/tasks/{task_id}/lineage:
    get:
      summary: 获取完整溯源图（DAG）
      tags: [lineage]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 溯源图（nodes + edges + stats）
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  nodes: { type: array, items: { type: object } }
                  edges: { type: array, items: { type: object } }
                  stats: { type: object }

  /api/v1/tasks/{task_id}/lineage/{record_id}:
    get:
      summary: 查询单条记录溯源链
      tags: [lineage]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: record_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 记录的完整处理链路
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  record_id: { type: string }
                  lineage: { type: array, items: { type: object } }
                  depth: { type: integer }
        '404': { description: 任务或记录不存在 }

  # ===== 用户反馈 =====
  /api/v1/tasks/{task_id}/feedback:
    post:
      summary: 提交用户反馈
      tags: [feedback]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback_type]
              properties:
                feedback_type:
                  type: string
                  enum: [refine_entities, retry_stage, general]
                message:
                  type: string
                  default: ""
                extra_entities:
                  type: object
                  nullable: true
                  description: 补充实实体（compounds/genes/diseases/pathways）
                retry_stage:
                  type: string
                  nullable: true
                  description: 请求重试的阶段（search/acquire/parse/clean/analyze/review）
      responses:
        '200':
          description: 反馈已记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: received }
                  task_id: { type: string }
                  feedback_type: { type: string }
        '404': { description: 任务不存在 }

  # ===== WebSocket =====
  /api/v1/ws/tasks/{task_id}:
    get:
      summary: WebSocket 订阅任务实时进度
      tags: [websocket]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      description: |
        连接后立即推送当前状态快照，之后推送增量更新。
        消息类型：
        - snapshot: 状态快照
        - task_start: 任务开始
        - stage_start: 阶段开始
        - stage_progress: 阶段进度（含 pct）
        - stage_complete: 阶段完成
        - iteration_round: 多轮迭代轮次
        - iteration_converged: 迭代收敛
        - task_complete: 任务完成
        - error: 错误
      responses:
        '101': { description: WebSocket 协议切换 }

components:
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
      description: 任务 ID

tags:
  - name: root
    description: 根路径
  - name: system
    description: 系统端点
  - name: tasks
    description: 任务 CRUD 与生命周期
  - name: data
    description: 数据查询与导出
  - name: lineage
    description: 数据溯源
  - name: feedback
    description: 用户反馈
  - name: websocket
    description: WebSocket 实时推送
