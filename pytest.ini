# Runtime dependencies - must mirror backend/pyproject.toml [project].dependencies.
# Consumed by .github/workflows/package.yml for the Windows PyInstaller packaging step.
# Guarded by tests/test_config.py::test_requirements_txt_in_sync_with_pyproject_runtime_deps.

[pytest]
addopts = -n auto --maxfail=5 --tb=short
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
